<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Integrador</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="inicio">
        <div class="encabezado">
            <div class="buscador" role="search">
                <input type="search" aria-label="Buscar productos" placeholder="Buscar productos">
            </div>

            <img class="logo" src="assets/img/juleriaque-logo-2026.webp" alt="Juleriaque">

            <div class="encabezado-imagenes">
                <img src="assets/img/web/cuenta.png" alt="Cuenta">
                <img src="assets/img/web/bolsa.png" alt="Bolsa">
            </div>
        </div>
    </header>

    <main>
        <h1>TP Integrador</h1>

        <section id="productos">
            <h2>Productos</h2>
        </section>

        <section id="contacto">
            <h2>Contacto</h2>
        </section>
    </main>
</body>
</html>
